name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install flake8
        run: python -m pip install --upgrade pip flake8
      - name: Blocking lint (syntax errors, undefined names)
        run: flake8 src tests scripts streamlit_app --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Style report (non-blocking)
        run: flake8 src --count --exit-zero --max-line-length=120 --ignore=E501,W503 --statistics

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Docs and public summary match the artifacts
        env:
          PYTHONPATH: .
        run: python scripts/build_public_results_summary.py --check

      - name: Run test suite
        env:
          PYTHONPATH: .
        run: pytest tests -q

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t firecast:ci .
